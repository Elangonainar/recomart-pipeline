stages:
  ingest:
    cmd: python3 ingest.py
    deps:
      - schema.sql
      - ingest.py
      - data/raw/
    outs:
      - data/recomart.db

  validate:
    cmd: python3 validation.py
    deps:
      - validation.py
      - data/recomart.db
    outs:
      - data/reports/validation.json

  prepare:
    cmd: python3 preparation.py
    deps:
      - preparation.py
      - data/recomart.db
    outs:
      - data/processed/users_prepared.csv
      - data/processed/items_prepared.csv
      - data/processed/interactions_observed_prepared.csv
      - data/processed/interactions_prepared.csv
      - data/reports/eda/rating_distribution.png
      - data/reports/eda/item_popularity.png
      - data/reports/eda/interaction_sparsity_heatmap.png
      - data/reports/preparation_summary.json

  transform:
    cmd: python3 transformation.py
    deps:
      - transformation.py
      - feature_schema.sql
      - data/recomart.db
      - data/processed/users_prepared.csv
      - data/processed/items_prepared.csv
      - data/processed/interactions_observed_prepared.csv
    outs:
      - data/reports/feature_summary.json

  feature_store:
    cmd: python3 feature_store.py materialize
    deps:
      - feature_store.py
      - feature_store_schema.sql
      - data/recomart.db
      - data/reports/feature_summary.json

  train:
    cmd: python3 train_models.py
    deps:
      - train_models.py
      - data/processed/items_prepared.csv
      - data/processed/interactions_observed_prepared.csv
    outs:
      - data/reports/model_runs.json
      - data/reports/model_performance.md
